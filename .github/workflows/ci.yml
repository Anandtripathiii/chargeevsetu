name: CI
# Every push and pull request: data gate + model self-check + type check + build. A red build never deploys broken data.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high --omit=dev
      - run: npm run build # runs scripts/check-data.mjs and scripts/selfcheck.mjs first
